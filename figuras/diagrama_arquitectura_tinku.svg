<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#FAFAFA"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1B2A38">Tinku — Arquitectura del sistema (MVP)</text>

  <!-- Cliente -->
  <rect x="60" y="70" width="220" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="170" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D47A1">Cliente (navegador)</text>
  <text x="170" y="120" text-anchor="middle" font-size="12" fill="#0D47A1">PWA — React/Next.js</text>
  <text x="170" y="137" text-anchor="middle" font-size="11" fill="#0D47A1">Alumno · Tutor · Adulto responsable</text>

  <!-- Vercel -->
  <rect x="60" y="190" width="220" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="170" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">Vercel</text>
  <text x="170" y="233" text-anchor="middle" font-size="11" fill="#1B5E20">Hosting frontend + CDN</text>

  <!-- Cloudflare Tunnel -->
  <rect x="360" y="190" width="220" height="60" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
  <text x="470" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Cloudflare Tunnel</text>
  <text x="470" y="233" text-anchor="middle" font-size="11" fill="#E65100">Sin puertos expuestos / sin IP pública</text>

  <!-- Backend -->
  <rect x="360" y="290" width="220" height="90" rx="10" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2"/>
  <text x="470" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#4527A0">Backend API REST</text>
  <text x="470" y="336" text-anchor="middle" font-size="11" fill="#4527A0">Spring Boot (Java)</text>
  <text x="470" y="352" text-anchor="middle" font-size="11" fill="#4527A0">Spring Security + JWT</text>
  <text x="470" y="368" text-anchor="middle" font-size="10" fill="#4527A0">Host: PC propia (Coolify) → VPS</text>

  <!-- Postgres -->
  <rect x="660" y="230" width="220" height="70" rx="10" fill="#E1F5FE" stroke="#0277BD" stroke-width="2"/>
  <text x="770" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579B">Supabase — Postgres</text>
  <text x="770" y="273" text-anchor="middle" font-size="11" fill="#01579B">Vía Supavisor (session mode)</text>
  <text x="770" y="289" text-anchor="middle" font-size="10" fill="#01579B">Modelo de datos principal</text>

  <!-- Redis -->
  <rect x="660" y="320" width="220" height="60" rx="10" fill="#FCE4EC" stroke="#AD1457" stroke-width="2"/>
  <text x="770" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#880E4F">Upstash — Redis</text>
  <text x="770" y="363" text-anchor="middle" font-size="11" fill="#880E4F">Caché, chat pub/sub, rate limiting</text>

  <!-- LiveKit -->
  <rect x="360" y="420" width="220" height="70" rx="10" fill="#F1F8E9" stroke="#558B2F" stroke-width="2"/>
  <text x="470" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#33691E">LiveKit Cloud</text>
  <text x="470" y="463" text-anchor="middle" font-size="11" fill="#33691E">Aula virtual — WebRTC (SFU)</text>
  <text x="470" y="479" text-anchor="middle" font-size="10" fill="#33691E">Plan gratuito / pago por minuto</text>

  <!-- MercadoPago -->
  <rect x="660" y="420" width="220" height="70" rx="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="2"/>
  <text x="770" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#F57F17">MercadoPago</text>
  <text x="770" y="463" text-anchor="middle" font-size="11" fill="#F57F17">SDK oficial Java — Escrow</text>
  <text x="770" y="479" text-anchor="middle" font-size="10" fill="#F57F17">Webhooks de pago</text>

  <!-- IA services -->
  <rect x="60" y="420" width="220" height="90" rx="10" fill="#EFEBE9" stroke="#4E342E" stroke-width="2"/>
  <text x="170" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Servicios de IA</text>
  <text x="170" y="463" text-anchor="middle" font-size="11" fill="#3E2723">Matching: sentence-transformers</text>
  <text x="170" y="479" text-anchor="middle" font-size="11" fill="#3E2723">Resumen/asistente: Whisper + LLM</text>
  <text x="170" y="495" text-anchor="middle" font-size="10" fill="#3E2723">Kill-switch: clasificador on-device</text>

  <!-- Admin -->
  <rect x="60" y="290" width="220" height="60" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <text x="170" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">Panel de administración</text>
  <text x="170" y="333" text-anchor="middle" font-size="11" fill="#4A148C">Moderación y denuncias (rol único)</text>

  <!-- Arrows -->
  <line x1="170" y1="150" x2="170" y2="190" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="105" x2="360" y2="220" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="170" font-size="10" fill="#37474F">HTTPS / REST</text>

  <line x1="470" y1="250" x2="470" y2="290" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="330" x2="660" y2="270" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="345" x2="660" y2="350" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="380" x2="470" y2="420" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="360" x2="660" y2="455" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="320" x2="360" y2="320" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="465" x2="360" y2="440" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="420" x2="170" y2="350" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="500" y="580" text-anchor="middle" font-size="11" fill="#546E7A">Estilo arquitectónico: cliente-servidor en capas, con servicios externos especializados (video, pagos, IA) desacoplados del backend propio.</text>
  <text x="500" y="600" text-anchor="middle" font-size="10" fill="#78909C">El backend se comunica con cada servicio externo mediante su SDK/API oficial; no hay lógica de negocio duplicada en los servicios de terceros.</text>
</svg>
