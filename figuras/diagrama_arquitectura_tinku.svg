<svg viewBox="0 0 1000 720" width="1000" height="720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#FAFAFA"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1B2A38">Tinku — Arquitectura del sistema (producción del piloto)</text>

  <!-- Usuarios: administración -->
  <rect x="40" y="55" width="220" height="95" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <text x="150" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">Administración (/admin)</text>
  <text x="150" y="99" text-anchor="middle" font-size="11" fill="#4A148C">Rol Moderación y Seguridad</text>
  <text x="150" y="115" text-anchor="middle" font-size="11" fill="#4A148C">Rol Soporte Financiero</text>
  <text x="150" y="133" text-anchor="middle" font-size="10" fill="#4A148C">Salud de Infraestructura</text>

  <!-- Usuarios: cliente -->
  <rect x="280" y="55" width="420" height="95" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="490" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D47A1">Cliente web (navegador, PWA)</text>
  <text x="490" y="97" text-anchor="middle" font-size="11" fill="#0D47A1">Alumno · Tutor · Adulto responsable · Menor (cuenta propia)</text>
  <text x="490" y="114" text-anchor="middle" font-size="11" fill="#0D47A1">Kill-switch: NSFWJS (TensorFlow.js) sobre el video remoto, en el navegador</text>
  <text x="490" y="131" text-anchor="middle" font-size="10" fill="#0D47A1">Audio del resumen: solo con el adicional, en el navegador del tutor</text>

  <!-- LiveKit -->
  <rect x="740" y="55" width="220" height="95" rx="10" fill="#F1F8E9" stroke="#558B2F" stroke-width="2"/>
  <text x="850" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#33691E">LiveKit Cloud</text>
  <text x="850" y="99" text-anchor="middle" font-size="11" fill="#33691E">Aula virtual — WebRTC</text>
  <text x="850" y="115" text-anchor="middle" font-size="11" fill="#33691E">Video, audio, pizarra y texto</text>
  <text x="850" y="133" text-anchor="middle" font-size="10" fill="#33691E">Plan gratuito (Build)</text>

  <!-- Cloudflare -->
  <rect x="40" y="185" width="660" height="45" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
  <text x="370" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Cloudflare — HTTPS y Cloudflare Tunnel</text>
  <text x="370" y="222" text-anchor="middle" font-size="11" fill="#E65100">Dominio público → frontend · subdominio de la API → backend · sin puertos abiertos ni IP fija</text>

  <!-- Servidor propio -->
  <rect x="30" y="245" width="680" height="335" rx="12" fill="#FFFFFF" stroke="#455A64" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="430" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">Servidor propio con Coolify (Docker Compose) — ningún contenedor publica puertos</text>

  <!-- cloudflared -->
  <rect x="60" y="285" width="160" height="80" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
  <text x="140" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">cloudflared</text>
  <text x="140" y="334" text-anchor="middle" font-size="11" fill="#E65100">Extremo del túnel</text>

  <!-- frontend -->
  <rect x="240" y="285" width="440" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="460" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">frontend — Next.js 16 + React 19</text>
  <text x="460" y="331" text-anchor="middle" font-size="11" fill="#0D47A1">Sirve la aplicación web y el modelo del clasificador</text>
  <text x="460" y="348" text-anchor="middle" font-size="10" fill="#0D47A1">Llama a la API REST del backend (JWT)</text>

  <!-- matching -->
  <rect x="60" y="390" width="200" height="95" rx="10" fill="#EFEBE9" stroke="#4E342E" stroke-width="2"/>
  <text x="160" y="413" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">matching (Python)</text>
  <text x="160" y="431" text-anchor="middle" font-size="11" fill="#3E2723">FastAPI + sentence-transformers</text>
  <text x="160" y="447" text-anchor="middle" font-size="10" fill="#3E2723">multilingual MiniLM, 384 dims</text>
  <text x="160" y="463" text-anchor="middle" font-size="10" fill="#3E2723">Único servicio propio aparte</text>

  <!-- backend -->
  <rect x="280" y="390" width="400" height="95" rx="10" fill="#EDE7F6" stroke="#5E35B1" stroke-width="2"/>
  <text x="480" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#4527A0">backend — Spring Boot 4.1 (Java 21)</text>
  <text x="480" y="431" text-anchor="middle" font-size="11" fill="#4527A0">Monolito modular: Identidad · Matching · Aula · Reservas · Pagos</text>
  <text x="480" y="447" text-anchor="middle" font-size="11" fill="#4527A0">Resumen · Reputación · Admin · Seguridad</text>
  <text x="480" y="465" text-anchor="middle" font-size="10" fill="#4527A0">Spring Security + JWT · Quartz persistido · OCR con Tesseract local</text>

  <!-- db -->
  <rect x="60" y="505" width="420" height="60" rx="10" fill="#E1F5FE" stroke="#0277BD" stroke-width="2"/>
  <text x="270" y="529" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579B">db — PostgreSQL 16 + pgvector</text>
  <text x="270" y="548" text-anchor="middle" font-size="11" fill="#01579B">Un esquema por módulo · Flyway · índice semántico · Quartz</text>

  <!-- backup -->
  <rect x="500" y="505" width="180" height="60" rx="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="2"/>
  <text x="590" y="529" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474F">backup</text>
  <text x="590" y="548" text-anchor="middle" font-size="11" fill="#37474F">pg_dump diario cifrado</text>

  <!-- Externos -->
  <rect x="740" y="260" width="220" height="70" rx="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="2"/>
  <text x="850" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#F57F17">MercadoPago</text>
  <text x="850" y="301" text-anchor="middle" font-size="11" fill="#F57F17">Checkout Pro, OAuth del tutor</text>
  <text x="850" y="317" text-anchor="middle" font-size="10" fill="#F57F17">Cliente HTTP propio · webhooks</text>

  <rect x="740" y="350" width="220" height="70" rx="10" fill="#E0F2F1" stroke="#00695C" stroke-width="2"/>
  <text x="850" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#004D40">OpenAI</text>
  <text x="850" y="391" text-anchor="middle" font-size="11" fill="#004D40">gpt-4o-mini-transcribe + GPT-4o</text>
  <text x="850" y="407" text-anchor="middle" font-size="10" fill="#004D40">Solo con el adicional; texto anonimizado</text>

  <rect x="740" y="440" width="220" height="60" rx="10" fill="#FCE4EC" stroke="#AD1457" stroke-width="2"/>
  <text x="850" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#880E4F">Resend</text>
  <text x="850" y="481" text-anchor="middle" font-size="11" fill="#880E4F">Correo transaccional</text>

  <!-- Abajo -->
  <rect x="40" y="610" width="420" height="55" rx="10" fill="#ECEFF1" stroke="#37474F" stroke-width="2"/>
  <text x="250" y="633" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">GitHub Actions → GHCR</text>
  <text x="250" y="651" text-anchor="middle" font-size="11" fill="#263238">Pruebas, imágenes de los contenedores y webhook de Coolify</text>

  <rect x="500" y="610" width="200" height="55" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
  <text x="600" y="633" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Cloudflare R2</text>
  <text x="600" y="651" text-anchor="middle" font-size="11" fill="#E65100">Copias de la base, 14 días</text>

  <!-- Flechas -->
  <line x1="150" y1="150" x2="150" y2="183" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="150" x2="490" y2="183" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="172" font-size="10" fill="#37474F">HTTPS</text>
  <line x1="700" y1="102" x2="738" y2="102" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="703" y="92" font-size="9" fill="#37474F">WebRTC</text>

  <line x1="140" y1="230" x2="140" y2="283" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="325" x2="238" y2="325" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="365" x2="300" y2="388" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="437" x2="262" y2="437" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="485" x2="160" y2="503" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="485" x2="400" y2="503" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="535" x2="498" y2="535" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="565" x2="600" y2="608" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="610" x2="250" y2="582" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="680" y1="395" x2="770" y2="152" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="762" y="242" font-size="9" fill="#37474F">tokens de sala</text>
  <line x1="680" y1="412" x2="738" y2="300" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="440" x2="738" y2="390" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="468" x2="738" y2="470" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="500" y="692" text-anchor="middle" font-size="11" fill="#546E7A">Monolito modular de nueve módulos más un único servicio propio aparte (matching). Sin Redis ni message broker;</text>
  <text x="500" y="708" text-anchor="middle" font-size="11" fill="#546E7A">los plazos de negocio corren en Quartz persistido en la base. Solo el backend tiene credenciales de los servicios externos.</text>
</svg>
